name: Publish to the Chrome Web Store
description: >-
  Upload an extension zip to the Chrome Web Store and submit it for review, authenticating
  with Workload Identity Federation (no stored keys or refresh tokens).

inputs:
  zip:
    description: Path to the extension zip
    required: true
  extension-id:
    description: Chrome Web Store item ID
    required: true
  publisher-id:
    description: Chrome Web Store publisher ID
    required: true
  workload-identity-provider:
    description: Full resource name of the GCP Workload Identity Provider
    required: true
  service-account:
    description: Service account email with access to the Chrome Web Store item
    required: true

runs:
  using: composite
  steps:
    # Short-lived Google token for the service account; the caller job needs `id-token: write`.
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      id: google
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/chromewebstore
        create_credentials_file: false

    - name: Upload and publish to the Chrome Web Store
      shell: bash
      env:
        ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        EXTENSION_ID: ${{ inputs.extension-id }}
        PUBLISHER_ID: ${{ inputs.publisher-id }}
        ZIP: ${{ inputs.zip }}
      run: bash "$GITHUB_ACTION_PATH/publish-chrome.sh" "$ZIP"
