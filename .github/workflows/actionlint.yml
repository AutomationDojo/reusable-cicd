# Reusable workflow for linting GitHub Actions workflows.
# The caller must set `permissions: contents: read, pull-requests: write`.
name: Actionlint

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      reporter:
        description: "reviewdog reporter to use"
        type: string
        default: "github-pr-review"

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: ${{ inputs.reporter || 'github-pr-review' }}
