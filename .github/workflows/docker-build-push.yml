# Reusable workflow for building and pushing Docker images to GHCR.
# The caller must set `permissions: contents: read` and `packages: write`.
# Typically called after a release workflow, passing the new version.
name: Docker Build and Push

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (without 'v' prefix) used for tag and checkout ref"
        type: string
        required: true
      context:
        description: "Docker build context path"
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile (relative to context)"
        type: string
        default: "Dockerfile"
      image-name:
        description: "Optional image name suffix for GHCR (e.g. 'api', 'worker'). When set, image is ghcr.io/owner/repo/<name>; when empty, ghcr.io/owner/repo."
        type: string
        default: ""
      platforms:
        description: "Comma-separated list of platforms to build"
        type: string
        default: "linux/amd64,linux/arm64"
      push:
        description: "Whether to push the image to the registry"
        type: boolean
        default: true
    secrets:
      GHCR_TOKEN:
        description: "Optional token for GHCR login (e.g. PAT with SSO). When not set, uses the default GITHUB_TOKEN."
        required: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Set image name (lowercase for GHCR)
        id: meta
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "${IMAGE_NAME}" ]; then
            echo "image=${base}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${base}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: v${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: inputs.push == true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.image }}:v${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-latest
    if: inputs.push == true
    permissions:
      packages: write

    steps:
      - name: Set image name (lowercase for GHCR)
        id: meta
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "${IMAGE_NAME}" ]; then
            echo "image=${base}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${base}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:v${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:v${VERSION}-amd64" \
            "${IMAGE}:v${VERSION}-arm64"