# Reusable workflow for linting Helm charts (chart-testing: ct lint).
# Uses helm/chart-testing-action; requires Helm and Python for yamllint/yamale.
name: Helm Lint

on:
  workflow_call:
    inputs:
      charts_dir:
        description: 'Directory containing Helm charts (passed to ct as --chart-dirs)'
        required: false
        type: string
        default: '.'
      config:
        description: 'Path to chart-testing config (e.g. .github/ct.yaml). If set, ct uses this instead of --chart-dirs'
        required: false
        type: string
        default: ''
      chart_testing_version:
        description: 'chart-testing CLI version'
        required: false
        type: string
        default: 'v3.11.0'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ inputs.chart_testing_version }}

      - name: Run chart-testing (lint)
        run: |
          if [ -n "${{ inputs.config }}" ]; then
            ct lint --config ${{ inputs.config }}
          else
            ct lint --chart-dirs ${{ inputs.charts_dir }}
          fi
