# Reusable workflow for releasing Go CLI apps.
# The caller must set `permissions: contents: write`.
name: Release CLI App

on:
  workflow_call:
    inputs:
      homebrew-tap-repo:
        description: "Repository name for the Homebrew tap app token"
        type: string
        default: "homebrew-tap"
      goreleaser-version:
        description: "GoReleaser version to use"
        type: string
        default: "2.14.0"
      node-version:
        description: "Node.js version for semantic-release"
        type: string
        default: "24"
      go-version-file:
        description: "Go version file to use"
        type: string
        default: "go.mod"
      go-sum-file:
        description: "Go sum file to use"
        type: string
        default: "go.sum"
    secrets:
      GITHUB_APP_ID:
        description: "GitHub App ID"
        required: true
      GITHUB_APP_PRIVATE_KEY:
        description: "GitHub App private key"
        required: true
    outputs:
      new-release:
        description: "Whether a new release was published"
        value: ${{ jobs.release.outputs.new-release }}
      version:
        description: "The new release version (without v prefix)"
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new-release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ secrets.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Setup Git (bot da App)
        run: |
          git config --global user.name "${{ steps.app.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}

      - id: semantic
        uses: cycjimmy/semantic-release-action@1989a0fefc4aea321e07f717680ed8e345925dc1 # v7.1.2
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  goreleaser:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release == 'true'
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ secrets.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.homebrew-tap-repo }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.go-sum-file }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ inputs.goreleaser-version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ needs.release.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app.outputs.token }}
